<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Un pequeño jardín para Manuela</title>
  <desc id="description">Una flor violeta rodeada de luces en una noche de jardín.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26113f"/><stop offset=".56" stop-color="#130920"/><stop offset="1" stop-color="#35113a"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ff83c8" stop-opacity=".36"/><stop offset="1" stop-color="#8f5cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0ed"/><stop offset="1" stop-color="#ff72c2"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#night)"/>
  <circle cx="910" cy="310" r="260" fill="url(#glow)" filter="url(#soft)"/>
  <g fill="#f4d9ff" opacity=".65">
    <circle cx="110" cy="115" r="3"/><circle cx="240" cy="490" r="2"/><circle cx="510" cy="145" r="2"/>
    <circle cx="1040" cy="110" r="3"/><circle cx="1080" cy="500" r="2"/><circle cx="770" cy="530" r="2"/>
  </g>
  <g fill="none" stroke="#d1baff" stroke-opacity=".28">
    <ellipse cx="915" cy="315" rx="230" ry="165"/><ellipse cx="915" cy="315" rx="180" ry="125" stroke-dasharray="4 10"/>
  </g>
  <g fill="#ff83c8" opacity=".8">
    <circle cx="685" cy="315" r="7"/><circle cx="915" cy="150" r="5"/><circle cx="1145" cy="315" r="7"/>
  </g>
  <g transform="translate(915 315)" fill="url(#petal)">
    <ellipse cx="0" cy="-68" rx="34" ry="62"/>
    <ellipse cx="0" cy="-68" rx="34" ry="62" transform="rotate(72)"/>
    <ellipse cx="0" cy="-68" rx="34" ry="62" transform="rotate(144)"/>
    <ellipse cx="0" cy="-68" rx="34" ry="62" transform="rotate(216)"/>
    <ellipse cx="0" cy="-68" rx="34" ry="62" transform="rotate(288)"/>
    <circle r="22" fill="#ffd4a8"/>
  </g>
  <text x="92" y="235" fill="#d1baff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">30 DE SEPTIEMBRE · NIVEL 19</text>
  <text x="88" y="330" fill="#fff8eb" font-family="Georgia,serif" font-size="72" font-weight="700">Un pequeño</text>
  <text x="88" y="414" fill="#fff8eb" font-family="Georgia,serif" font-size="72" font-weight="700">jardín para Manuela</text>
  <text x="94" y="485" fill="#cbbfd8" font-family="Arial,sans-serif" font-size="25">Recuerdos, gatos y un cumpleaños hecho con cariño.</text>
</svg>
